    <!-- Consola de diagnostico: se instala antes que UnityLoader para capturar
         tambien los logs y errores que ocurren durante el arranque del player.
         La interfaz visible se construye al final del body (F2). -->
    <script>
      (function () {
        'use strict';
        var MAX = 2000;
        var logs = [];
        window.__ukLogs = logs;
        window.__ukLogErrorCount = 0;

        function stringify(value) {
          if (typeof value === 'string') return value;
          if (value instanceof Error) return value.stack || (value.name + ': ' + value.message);
          if (value === undefined) return 'undefined';
          if (value === null) return 'null';
          try { return JSON.stringify(value); }
          catch (e) {
            try { return String(value); } catch (e2) { return '[objeto no serializable]'; }
          }
        }

        function add(level, args) {
          var parts = [];
          for (var i = 0; i < args.length; i++) parts.push(stringify(args[i]));
          var text = parts.join(' ').slice(0, 8000);
          var entry = { time: Date.now(), level: level, text: text };
          logs.push(entry);
          if (logs.length > MAX) logs.shift();
          if (window.__ukLogAppend) {
            try { window.__ukLogAppend(entry); } catch (e) {}
          }
          if (level === 'error') {
            window.__ukLogErrorCount++;
            if (window.__ukLogOnError) {
              try { window.__ukLogOnError(); } catch (e) {}
            }
          }
        }

        var methods = ['log', 'info', 'warn', 'error', 'debug'];
        for (var i = 0; i < methods.length; i++) {
          (function (name) {
            var original = console[name];
            if (typeof original !== 'function') return;
            var level = (name === 'warn') ? 'warning' : name;
            console[name] = function () {
              add(level, arguments);
              return original.apply(console, arguments);
            };
          })(methods[i]);
        }

        window.UKLog = function (message, level) {
          add(level || 'info', [message]);
        };

        window.addEventListener('error', function (e) {
          if (!e || (!e.message && !e.error)) return;
          var where = '';
          if (e.filename) where = ' @ ' + e.filename + ':' + (e.lineno || 0) + ':' + (e.colno || 0);
          add('error', [(e.message || 'Error de script') + where + (e.error && e.error.stack ? '\n' + e.error.stack : '')]);
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e ? e.reason : null;
          add('error', ['Promesa rechazada sin capturar: ' + stringify(reason) + (reason && reason.stack ? '\n' + reason.stack : '')]);
        });
      })();
    </script>

    <script>
      (function () {
        'use strict';

        // Puente con la consola visible (script del <head>). Si por lo que sea
        // no existiera, el menu sigue funcionando igual.
        function diag(message, level) {
          if (typeof window.UKLog === 'function') {
            try { window.UKLog(message, level || 'info'); } catch (e) {}
          }
        }

        // =====================================================================
        // Bloqueo del raton: el juego lo suelta y lo vuelve a pedir en CADA
        // evento de raton (lo hace el modulo de input de la UI,
        // FirstPersonInputModule, presente en los niveles 0-2..0-5).
        // En el navegador eso es fatal: Chrome suelta el bloqueo y no lo
        // vuelve a conceder sin un gesto del usuario, asi que la camara se
        // queda con el raton absoluto y no puede girar 360 grados.
        // Aqui se retrasa la liberacion: si el juego sigue en partida (cursor
        // oculto) el raton NO se suelta; si el juego ha abierto un menu
        // (cursor visible) la liberacion se aplica y el menu se puede usar.
        // Si ademas el juego vuelve a pedir el bloqueo (patron "suelta y
        // vuelve a pedir" de la UI), se cancela la liberacion pendiente.
        (function () {
          try {
            var nativeExit = document.exitPointerLock;
            if (!nativeExit) return;
            // El menu F3 necesita soltar el raton aunque el juego lo mantenga
            // oculto (el wrapper de abajo retrasa la liberacion en partida).
            window.__ukNativeExitPointerLock = nativeExit;
            var releaseTimer = 0;
            document.exitPointerLock = function () {
              if (releaseTimer) { clearTimeout(releaseTimer); releaseTimer = 0; }
              releaseTimer = setTimeout(function () {
                releaseTimer = 0;
                var c = canvasEl();
                var hidden = false;
                try { hidden = !!c && getComputedStyle(c).cursor === 'none'; } catch (e) {}
                if (hidden) return;   // el juego sigue en partida: no perder el raton
                nativeExit.call(document);
              }, 250);
            };
            try {
              var proto = HTMLCanvasElement.prototype;
              var nativeReq = proto.requestPointerLock;
              if (nativeReq) {
                proto.requestPointerLock = function () {
                  if (releaseTimer) { clearTimeout(releaseTimer); releaseTimer = 0; }
                  return nativeReq.apply(this, arguments);
                };
              }
            } catch (e) {}
          } catch (e) {}
        })();

        // =====================================================================
        // Pantalla completa con bloqueo de teclado
        // =====================================================================
        // Chrome/Edge: navigator.keyboard.lock() captura TODAS las teclas
        // (Escape, Ctrl+D, Ctrl+T, Ctrl+W...).
        // Firefox 151+/Safari 26.4+: requestFullscreen({ keyboardLock: "browser" })
        // hace que Escape solo salga con pulsacion larga y permite anular atajos.
        // En navegadores sin navigator.keyboard (Firefox/Safari) anadimos la
        // opcion a cualquier requestFullscreen (incluida la de Unity); si no
        // la soportan, se reintenta sin ella.
        try {
          var nativeRequestFs = Element.prototype.requestFullscreen;
          // Chrome/Edge usan navigator.keyboard.lock() (no soportan la opcion
          // nueva). Firefox 151+/Safari 26.4+ usan la opcion keyboardLock.
          var fsKeyboardLock = !(navigator.keyboard && navigator.keyboard.lock);
          var fsOptionRejected = false;
          if (nativeRequestFs) {
            Element.prototype.requestFullscreen = function (options) {
              // Si ya estamos en pantalla completa (o hay una peticion en
              // curso) NO se vuelve a pedir. Una segunda peticion hace que el
              // navegador salga y vuelva a entrar de fullscreen, y al salir
              // Chrome libera el bloqueo de teclado: los atajos del navegador
              // (Ctrl+D, Ctrl+T, Ctrl+W) volvian a funcionar.
              if (isFs() || fsRequestInFlight) {
                return Promise.resolve();
              }
              var self = this;
              var done = function () { fsRequestInFlight = false; };
              fsRequestInFlight = true;

              if (!fsKeyboardLock) {
                var p0 = nativeRequestFs.call(this, options);
                if (p0 && p0.then) { p0.then(done, done); } else { done(); }
                return p0;
              }

              var opts = {};
              if (options) {
                for (var k in options) {
                  if (Object.prototype.hasOwnProperty.call(options, k)) opts[k] = options[k];
                }
              }
              opts.keyboardLock = 'browser';
              var p;
              try {
                p = nativeRequestFs.call(this, opts);
              } catch (e) {
                fsKeyboardLock = false;
                fsOptionRejected = true;
                done();
                return nativeRequestFs.call(this, options);
              }
              if (p && p.then) {
                // Si el navegador no soporta la opcion (NotSupportedError) se
                // desactiva para siempre y se reintenta sin ella: Chrome/Edge
                // usan navigator.keyboard.lock().
                return p.then(function (v) { done(); return v; }, function (err) {
                  done();
                  if (err && (err.name === 'NotSupportedError' || err.name === 'TypeError')) {
                    fsKeyboardLock = false;
                    fsOptionRejected = true;
                    return nativeRequestFs.call(self, options);
                  }
                  throw err;
                });
              }
              done();
              return p;
            };
          }
        } catch (e) {}

        var lockActive = false;
        var desired = false;
        var fsFallback = false;
        var reentryToken = 0;
        var lockTimers = [];
        var fsRequestInFlight = false;
        var kbRetryAt = 0;
        var escapeHeldSince = 0;
        var lastEscapeHeldMs = 0;
        var lastEscapeAt = 0;
        // Chrome SOLO concede el bloqueo de teclado (navigator.keyboard.lock)
        // en pantalla completa iniciada por JavaScript ("The Keyboard Lock API
        // is only available when JavaScript-initiated full screen is active",
        // docs de Chrome). Sin fullscreen el lock() falla y los atajos del
        // navegador (Ctrl+D, Ctrl+T, Ctrl+W) se cuelan. Por eso se entra en
        // pantalla completa con el primer gesto real del usuario.
        var autoFs = true;
        // Momento en el que se concedio el bloqueo por ultima vez: Chrome
        // puede soltarlo en silencio (Escape, perdida de foco) sin avisar,
        // asi que no basta con fiar de lockActive.
        var lockGrantedAt = 0;
        var btn = document.getElementById('uk-fs-btn');
        var statusEl = document.getElementById('uk-fs-status');

        var isFirefox = /Firefox\//.test(navigator.userAgent);
        var firefoxVersion = (function () {
          var m = navigator.userAgent.match(/Firefox\/(\d+)/);
          return m ? parseInt(m[1], 10) : 0;
        })();
        var oldFirefox = isFirefox && firefoxVersion > 0 && firefoxVersion < 151;

        function fsEl() {
          return document.fullscreenElement || document.webkitFullscreenElement || null;
        }

        function isFs() { return !!fsEl(); }

        function canvasEl() {
          return document.querySelector('#unityContainer canvas') || document.querySelector('canvas');
        }

        function requestFs() {
          // Pide el fullscreen directamente sobre el contenedor del canvas: asi
          // la peticion sale DENTRO del clic (con gesto de usuario), que es lo
          // que exige el navegador. Despues se avisa a Unity para que su
          // estado interno quede sincronizado; su peticion se ignora (ya hay
          // una en curso) porque una segunda haria que el navegador saliera y
          // volviera a entrar de fullscreen, y al salir Chrome suelta el
          // bloqueo de teclado (vuelven los atajos Ctrl+D, Ctrl+T, Ctrl+W).
          try {
            var c = canvasEl();
            var el = (c && c.parentNode) || document.documentElement;
            if (el.requestFullscreen) {
              // El parche de requestFullscreen (arriba) se encarga de marcar
              // la peticion en curso y de inyectar la opcion keyboardLock.
              var pf = el.requestFullscreen();
              if (pf && pf.catch) pf.catch(function () {});
            }
          } catch (e) {}
          try {
            if (window.unityInstance && unityInstance.SetFullscreen) {
              unityInstance.SetFullscreen(1);
            }
          } catch (e) {}
        }

        function exitFs() {
          try {
            if (window.unityInstance && unityInstance.SetFullscreen) {
              unityInstance.SetFullscreen(0);
              return;
            }
          } catch (e) {}
          try {
            if (document.exitFullscreen) {
              var p = document.exitFullscreen();
              if (p && p.catch) p.catch(function () {});
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            }
          } catch (e) {}
        }

        // Reintento de fullscreen tras un Escape: pide fullscreen sobre el
        // contenedor que Unity reconoce (el padre del canvas), sin crear nodos.
        function requestFsNative() {
          try {
            var c = canvasEl();
            var el = (c && c.parentNode) || document.documentElement;
            var fn = el.requestFullscreen || el.webkitRequestFullscreen;
            if (!fn) return false;
            var p = fn.call(el);
            if (p && p.catch) p.catch(function () {});
            return true;
          } catch (e) { return false; }
        }

        function updateStatus() {
          if (!statusEl) return;
          if (!isFs()) { statusEl.textContent = ''; return; }
          // Estado del raton: si el juego lo tiene oculto (estamos jugando) y
          // no hay bloqueo, el jugador debe saber que hay que pulsar una tecla.
          var raton = lockHeld()
            ? 'Ratón bloqueado'
            : (gameCursorHidden() ? 'Ratón sin bloqueo: pulsa una tecla' : '');
          if (navigator.keyboard && navigator.keyboard.lock) {
            var tec;
            if (lockActive) {
              tec = 'Teclado bloqueado';
            } else if (!isFs()) {
              tec = 'Entra en pantalla completa para bloquear los atajos';
            } else {
              tec = 'Pulsa una tecla para bloquear los atajos';
            }
            statusEl.textContent = raton ? (raton + ' · ' + tec) : tec;
          } else if (oldFirefox) {
            statusEl.textContent = 'Firefox antiguo: no puede bloquear atajos. Usa Chrome/Edge.';
          } else if (fsOptionRejected) {
            statusEl.textContent = 'Teclado sin bloqueo: usa Chrome/Edge.';
          } else {

        function lockKeyboard() {
          if (!navigator.keyboard || !navigator.keyboard.lock) return;
          try {
            var p = navigator.keyboard.lock(); // todas las teclas
            if (p && p.then) {
              p.then(function () {
                lockActive = true;
                lockGrantedAt = Date.now();
                updateStatus();
              }).catch(function () {
                lockActive = false;
                updateStatus();
              });
            } else {
              lockActive = true;
              lockGrantedAt = Date.now();
              updateStatus();
            }
          } catch (e) {
            lockActive = false;
            updateStatus();
          }
        }

        function unlockKeyboard() {
          lockActive = false;
          if (!navigator.keyboard || !navigator.keyboard.unlock) return;
          try { navigator.keyboard.unlock(); } catch (e) {}
        }

        function scheduleLockRetries() {
          for (var i = 0; i < lockTimers.length; i++) clearTimeout(lockTimers[i]);
          lockTimers = [];
          var delays = [0, 200, 600, 1500, 3000];
          for (var j = 0; j < delays.length; j++) {
            (function (ms) {
              lockTimers.push(setTimeout(function () {
                if (isFs() && !lockActive) lockKeyboard();
              }, ms));
            })(delays[j]);
          }
        }

        function setLabel(text) {
          if (btn) btn.textContent = text;
        }

        function flashButton() {
          if (!btn) return;
          btn.classList.remove('flash');
          void btn.offsetWidth;
          btn.classList.add('flash');
        }

        // Los overlays (menu de niveles, aviso, estado del teclado) tienen que
        // estar DENTRO del elemento fullscreen para que se vean. Moverlos
        // conserva su identidad y sus handlers.
        function moveOverlays(inside) {
          try {
            var c = canvasEl();
            var cont = (c && c.parentNode) || document.getElementById('unityContainer');
            if (!cont) return;
            var panel = document.getElementById('uk-dbg-panel');
            var toast = document.getElementById('uk-toast');
            var status = document.getElementById('uk-fs-status');
            var logPanel = document.getElementById('uk-log-panel');
            var logFab = document.getElementById('uk-log-fab');
            if (!panel || !toast || !status) return;
            if (!moveOverlays.home) {
              moveOverlays.home = {
                panel: panel.parentNode,
                toast: toast.parentNode,
                status: status.parentNode,
                logPanel: logPanel ? logPanel.parentNode : null,
                logFab: logFab ? logFab.parentNode : null
              };
            }
            var home = moveOverlays.home;
            if (inside) {
              if (panel.parentNode !== cont) cont.appendChild(panel);
              if (toast.parentNode !== cont) cont.appendChild(toast);
              if (status.parentNode !== cont) {
                cont.appendChild(status);
                status.classList.add('in-fs');
              }
              if (logPanel && logPanel.parentNode !== cont) cont.appendChild(logPanel);
              if (logFab) {
                if (logFab.parentNode !== cont) cont.appendChild(logFab);
                logFab.classList.add('in-fs');
              }
            } else {
              if (panel.parentNode !== home.panel) home.panel.appendChild(panel);
              if (toast.parentNode !== home.toast) home.toast.appendChild(toast);
              if (status.parentNode !== home.status) {
                home.status.appendChild(status);
                status.classList.remove('in-fs');
              }
              if (logPanel && home.logPanel && logPanel.parentNode !== home.logPanel) home.logPanel.appendChild(logPanel);
              if (logFab) {
                if (home.logFab && logFab.parentNode !== home.logFab) home.logFab.appendChild(logFab);
                logFab.classList.remove('in-fs');
              }
            }
          } catch (e) {}
        }

        function onFullscreenChange() {
          fsRequestInFlight = false;
          if (isFs()) {

            desired = true;

            lockKeyboard();
            scheduleLockRetries();
            updateStatus();
            return;
          }

          // Al salir de fullscreen el bloqueo de teclado se desactiva solo
          // (Chrome lo libera en cuanto sales de pantalla completa).
          moveOverlays(false);
          unlockKeyboard();
          for (var i = 0; i < lockTimers.length; i++) clearTimeout(lockTimers[i]);
          lockTimers = [];
          setLabel('PANTALLA COMPLETA');
          updateStatus();

          // Salida INTENCIONAL: el usuario la ha pedido (boton, Shift+Esc o
          // Escape pulsado largo). No se re-entra.
          var heldLong = (escapeHeldSince > 0 && (Date.now() - escapeHeldSince) > 900) ||
                         (lastEscapeHeldMs > 900 && (Date.now() - lastEscapeAt) < 3000);
          if (!desired || heldLong) {
            desired = false;
            fsFallback = false;
            return;
          }

          // volver a bloquear el teclado. Antes, cualquier salida mataba el
          // bloqueo para siempre (el estado "wasLocked" se comprobaba DESPUES
          // de poner lockActive=false, asi que nunca era cierto) y los atajos
          // del navegador (Ctrl+D, Ctrl+T, Ctrl+W) volvian a funcionar.
          var token = ++reentryToken;
          setTimeout(function () {
            if (token !== reentryToken || isFs()) return;
            if (!requestFsNative()) {
              desired = false;
              flashButton();
              return;
            }
            setTimeout(function () {
              if (token !== reentryToken) return;
              if (!isFs()) {
                // El navegador exige un clic: queda el boton y se reintenta
                // en el siguiente clic/tecla dentro del juego.
                desired = false;
                fsFallback = true;
                flashButton();
              }
            }, 800);
          }, 80);
        }

        function toggle() {
          if (isFs() || desired) {

            unlockKeyboard();
            exitFs();

            desired = true;
            fsFallback = false;
            requestFs();

        // =====================================================================
        // Pointer lock (camara)
        // =====================================================================
        // El juego pide el bloqueo del raton al entrar en el nivel, pero el
        // navegador solo lo concede si la peticion se hace dentro de un gesto
        // del usuario (tecla o clic). Ademas Chrome rechaza la peticion
        // durante ~1,3 s despues de que el usuario abandone el bloqueo
        // (tecla Esc): "Pointer lock cannot be acquired immediately after the
        // user has exited the lock".
        // Si no se reintenta, la camara se queda con el raton absoluto y da
        // saltos al moverlo; ademas cada nueva pulsacion de Esc reinicia ese
        // bloqueo de Chrome y la camara no se recupera nunca.
        // Por eso reintentamos en cada gesto (tecla o clic) y de forma
        // periodica mientras el juego tenga el raton oculto.
        var lockPending = false;
        var lockRetryAt = 0;
        var lockBackoff = 700;

        function gameCursorHidden() {
          var c = canvasEl();
          if (!c) return false;
          try { return getComputedStyle(c).cursor === 'none'; } catch (e) { return false; }
        }

        function lockHeld() {
          var c = canvasEl();
          return !!(c && document.pointerLockElement === c);
        }

        function requestPointerLock() {
          // Con el menu F3 o la consola abiertos el raton debe quedar libre
          // para poder pulsar botones; si no, el reintento periodico lo
          // recaptura.
          if (dbgOpen || logOpen) { lockPending = false; return; }
          var c = canvasEl();
          if (!c) return;
          if (lockHeld()) { lockPending = false; lockBackoff = 700; return; }
          // Si el juego esta en un menu o en pausa el cursor esta visible:
          // no se pide el bloqueo, pero se recuerda para intentarlo en el
          // siguiente gesto (al reanudar la partida).
          if (!gameCursorHidden()) { lockPending = true; return; }
          try {
            var p = c.requestPointerLock();
            lockPending = true;
            if (p && p.catch) {
              p.catch(function () { lockPending = true; });
            }
          } catch (e) {
            lockPending = true;
          }
        }

        // Reintento periodico mientras el juego mantiene el raton oculto y
        // no tenemos el bloqueo. Chrome rechaza el bloqueo durante ~1,3 s
        // despues de que el usuario lo abandone con la tecla Esc, asi que hay
        // que seguir insistiendo: si el ultimo gesto del usuario es reciente
        // (Chrome mantiene la activacion ~5 s) el reintento se concede solo.
        var lastCursorHidden = false;
        setInterval(function () {
          var hidden = gameCursorHidden();
          // El juego esta en partida y no tenemos el bloqueo del raton:
          // hay que seguir insistiendo (el navegador lo suelta al cambiar de
          // nivel, al pulsar Escape, al perder el foco...).
          if (hidden && !lockHeld()) lockPending = true;
          // El juego acaba de entrar en partida (o ha reanudado).
          if (hidden && !lastCursorHidden) lockPending = true;
          lastCursorHidden = hidden;
          if (!lockPending) return;
          if (lockHeld()) { lockPending = false; return; }
          if (!hidden) return;   // menus/pausa: el raton esta visible
          var now = Date.now();
          if (now < lockRetryAt) return;
          lockRetryAt = now + lockBackoff;
          lockBackoff = Math.min(lockBackoff * 2, 2000);   // espera creciente
          requestPointerLock();

        // "transient activation" (un gesto del usuario en los ultimos ~5 s),
        // asi que se reintenta un rato despues de cada gesto. YA NO hace falta
        // estar en pantalla completa: antes el bloqueo solo se pedia dentro de
        // "if (isFs())" y por eso los atajos del navegador (Ctrl+D, Ctrl+T,
        // Ctrl+W) se colaban fuera de fullscreen.
        setInterval(function () {
          if (!navigator.keyboard || !navigator.keyboard.lock) return;
          var now = Date.now();

          // lockActive puede quedarse obsoleto: Chrome suelta el bloqueo al
          // pulsar Escape o al perder el foco, y no avisa. Si el bloqueo no se
          // ha confirmado hace poco, se vuelve a pedir.

        // sin avisar: hay que olvidarse del estado para que los reintentos
        // vuelvan a pedirlo.

          updateStatus();
        });

            updateStatus();
          }
        });

        function capturePointer() {

          // si no, al pinchar en un boton se capturaria el puntero y la
          // interfaz dejaria de responder.
          if (dbgOpen || logOpen) return;
          // Un gesto nuevo del usuario reinicia la espera de los reintentos.
          lockBackoff = 700;

            fsFallback = false;

        // Teclado: reintentar bloqueo y anular atajos del navegador
        // =====================================================================
        // El bloqueo de teclado (navigator.keyboard.lock) SOLO se concede si la
        // peticion sale de un GESTO del usuario (transient activation). Antes
        // solo se pedia dentro de "if (isFs())", de modo que FUERA de pantalla
        // completa el teclado nunca se bloqueaba y los atajos de Chrome
        // (Ctrl+D marcadores, Ctrl+T pestanas, Ctrl+W, Ctrl+N) se colaban.
        // Ademas Esc suelta el bloqueo del teclado (y sale de fullscreen), con

            // iniciada por JavaScript. Este gesto es justo lo que el navegador
            // exige para concederla, asi que se pide aqui: sin esto el juego

          // Se llama SIEMPRE (no solo si !lockActive): Chrome suelta el bloqueo

          if (!isModifierKey(e)) {

        function sendDebug(method, payload) {
            try {
                if (!window.unityInstance || !unityInstance.SendMessage) {

                    diag('No se pudo enviar ' + method + ': el juego aun no ha cargado.', 'warning');

                }
                diag('→ ' + method + ' ' + payload, 'debug');
                unityInstance.SendMessage('MapLoader', method, payload);
                setTimeout(requestDebugState, 150);
            } catch (e) {
                toast('No se pudo aplicar: ' + e);
                diag('Error al enviar ' + method + ': ' + e, 'error');
            }
        }

        function requestDebugState() {

        function setCheck(el, checked, indeterminate) {

        function applyDebugState(st) {
            if (!st) return;

                if (layer.index === 4) {
                    setCheck(check, st.prime > 0, false);
                } else {
                    setCheck(check, st.progress > layer.lastLevel, false);
                }
            });
            if (allLevelsCheck) {
                setCheck(allLevelsCheck, st.progress > 15 && st.prime > 0, false);
            }
            var allGear = true;
            var someGear = false;
            UK_ALL_GEAR_IDS.forEach(function (id) {
                var v = (st.gear && st.gear[id]) ? 1 : 0;
                if (v) someGear = true; else allGear = false;
            });
            if (allGearCheck) setCheck(allGearCheck, allGear, someGear && !allGear);
            UK_GEAR.forEach(function (family) {
                var check = gearChecks[family[1]];
                if (!check) return;
                var all = true;
                var some = false;
                family[2].forEach(function (id) {
                    var v = (st.gear && st.gear[id]) ? 1 : 0;
                    if (v) some = true; else all = false;
                });
                setCheck(check, all, some && !all);
            });
        }

        function parseDebugState(raw) {
            var parts = String(raw).split('|');
            if (parts.length < 6) return null;
            var values = parts[5].split(',');
            var gear = {};
            UK_ALL_GEAR_IDS.forEach(function (id, i) {
                gear[id] = parseInt(values[i], 10) || 0;
            });
            return {
                progress: parseInt(parts[0], 10) || 0,
                difficulty: parseInt(parts[1], 10) || 0,
                tutorial: parts[2] === '1',
                intro: parts[3] === '1',
                prime: parseInt(parts[4], 10) || 0,
                gear: gear
            };
        }

        window.UKDebugReceiveState = function (raw) {
            try {
                var st = parseDebugState(raw);
                if (!st) {
                    diag('Estado F3 invalido: ' + raw, 'warning');
                    return;
                }
                applyDebugState(st);
                diag('Estado F3: ' + raw, 'debug');
            } catch (e) {
                diag('Error al leer el estado F3: ' + e, 'error');
            }
        };

        function releasePointerForMenu() {
            try {
                if (document.pointerLockElement && window.__ukNativeExitPointerLock) {
                    window.__ukNativeExitPointerLock.call(document);
                } else if (document.exitPointerLock) {
                    document.exitPointerLock();
                }
            } catch (e) {}
        }

        var toastEl = document.getElementById('uk-toast');
        var toastTimer = 0;

        function toast(msg, ms) {
            if (!toastEl) return;
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function () {
                toastEl.classList.remove('show');
            }, ms || 2600);
        }

        function jumpToLevel(sceneName) {
            try {
                if (!window.unityInstance || !unityInstance.SendMessage) {
                    toast('El juego aun no ha cargado.');
                    diag('No se puede cargar ' + sceneName + ': el juego aun no ha cargado.', 'warning');
                    return;
                }
                // MapLoader.DebugLoadLevel elige el bundle del acto segun el
                // nombre del nivel (FinalRank solo cargaba el acto actual).
                diag('Cargando escena ' + sceneName, 'info');
                unityInstance.SendMessage('MapLoader', 'DebugLoadLevel', sceneName);
                toast('Cargando ' + sceneName + '...');
                if (dbgPanel) dbgPanel.classList.remove('open');
                dbgOpen = false;
            } catch (e) {
                toast('No se pudo cargar el nivel: ' + e);
                diag('Error al cargar ' + sceneName + ': ' + e, 'error');
            }
        }

        // OJO: tiene que estar en window, porque el boton lo llama desde su
        // atributo onclick (fuera del IIFE). Con "var" aqui el ReferenceError
        // hacia que el menu de niveles no hiciera nada.
        window.UKDebug = {
            toggle: function () {
                buildDebugList();
                dbgOpen = !dbgOpen;
                if (dbgPanel) {
                    if (dbgOpen) dbgPanel.classList.add('open');
                    else dbgPanel.classList.remove('open');
                }
                if (dbgOpen) {
                    // Sin esto el juego mantiene el raton capturado y no se
                    // puede hacer clic en los checkboxes.
                    releasePointerForMenu();
                    requestDebugState();
                }
                diag('Menu F3 ' + (dbgOpen ? 'abierto' : 'cerrado'), 'info');
            }
        };

        // =====================================================================
        // Consola visible (F2): logs de Unity, errores JS y trazas.
        // El capturador vive en el <head> (window.__ukLogs); aqui solo se
        // pinta y se controla el panel.
        // =====================================================================
        var logPanel = document.getElementById('uk-log-panel');
        var logBody = document.getElementById('uk-log-body');
        var logCountEl = document.getElementById('uk-log-count');
        var logFab = document.getElementById('uk-log-fab');
        var logFabCount = document.getElementById('uk-log-fab-count');
        var logFilterBtn = document.getElementById('uk-log-filter');
        var logCopyBtn = document.getElementById('uk-log-copy');
        var logClearBtn = document.getElementById('uk-log-clear');
        var logCloseBtn = document.getElementById('uk-log-close');
        var logFilterErrors = false;

        function logEntries() {
            return window.__ukLogs || [];
        }

        function formatLogTime(ms) {
            var d = new Date(ms);
            function p(n) { return (n < 10 ? '0' : '') + n; }
            return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + '.' + ('00' + d.getMilliseconds()).slice(-3);
        }

        function logLevelLabel(level) {
            if (level === 'error') return 'ERR';
            if (level === 'warning') return 'WARN';
            if (level === 'debug') return 'DBG';
            return 'INFO';
        }

        function makeLogLine(entry) {
            var line = document.createElement('div');
            line.className = 'uk-log-line uk-log-' + (entry.level || 'info');
            var time = document.createElement('span');
            time.className = 'uk-log-time';
            time.textContent = formatLogTime(entry.time);
            var lvl = document.createElement('span');
            lvl.className = 'uk-log-level';
            lvl.textContent = logLevelLabel(entry.level);
            var msg = document.createElement('span');
            msg.className = 'uk-log-msg';
            msg.textContent = entry.text;
            line.appendChild(time);
            line.appendChild(lvl);
            line.appendChild(msg);
            return line;
        }

        function updateLogBadge() {
            var count = window.__ukLogErrorCount || 0;
            if (logCountEl) logCountEl.textContent = count + (count === 1 ? ' error' : ' errores');
            if (logFabCount) {
                logFabCount.textContent = count > 99 ? '99+' : String(count);
                if (count > 0) logFabCount.classList.remove('hidden');
                else logFabCount.classList.add('hidden');
            }
        }

        function appendLogEntry(entry) {
            if (!logBody) return;
            var nearBottom = (logBody.scrollHeight - logBody.scrollTop - logBody.clientHeight) < 40;
            logBody.appendChild(makeLogLine(entry));
            while (logBody.childNodes.length > 2000) logBody.removeChild(logBody.firstChild);
            if (nearBottom) logBody.scrollTop = logBody.scrollHeight;
            updateLogBadge();
        }
        window.__ukLogAppend = appendLogEntry;

        function renderAllLogs() {
            if (!logBody) return;
            logBody.textContent = '';
            var entries = logEntries();
            for (var i = 0; i < entries.length; i++) logBody.appendChild(makeLogLine(entries[i]));
            logBody.scrollTop = logBody.scrollHeight;
            updateLogBadge();
        }

        function openLog() {
            if (!logPanel) return;
            logPanel.classList.add('open');
            logOpen = true;
            renderAllLogs();
            releasePointerForMenu();
            updateLogBadge();
            if (logBody) logBody.scrollTop = logBody.scrollHeight;
        }

        function closeLog() {
            if (!logPanel) return;
            logPanel.classList.remove('open');
            logOpen = false;
        }

        window.UKLogUI = {
            toggle: function () {
                if (logOpen) closeLog();
                else openLog();
            },
            open: openLog,
            close: closeLog
        };

        window.__ukLogOnError = function () {
            updateLogBadge();
            if (!logOpen) openLog();
        };

        if (logFab) {
            logFab.addEventListener('click', function () {
                window.UKLogUI.toggle();
            });
        }
        if (logCloseBtn) logCloseBtn.addEventListener('click', closeLog);
        if (logFilterBtn) {
            logFilterBtn.addEventListener('click', function () {
                logFilterErrors = !logFilterErrors;
                if (logBody) {
                    if (logFilterErrors) logBody.classList.add('filter-errors');
                    else logBody.classList.remove('filter-errors');
                }
                logFilterBtn.textContent = logFilterErrors ? 'VER TODO' : 'SOLO ERRORES';
                logFilterBtn.classList.toggle('active', logFilterErrors);
            });
        }
        if (logClearBtn) {
            logClearBtn.addEventListener('click', function () {
                if (window.__ukLogs) window.__ukLogs.length = 0;
                window.__ukLogErrorCount = 0;
                if (logBody) logBody.textContent = '';
                updateLogBadge();
            });
        }
        if (logCopyBtn) {
            logCopyBtn.addEventListener('click', function () {
                var text = logEntries().map(function (entry) {
                    return '[' + formatLogTime(entry.time) + '] ' + logLevelLabel(entry.level) + ' ' + entry.text;
                }).join('\n');
                function fallbackCopy() {
                    try {
                        var ta = document.createElement('textarea');
                        ta.value = text;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                        toast('Logs copiados.');
                    } catch (e) {
                        toast('No se pudo copiar.');
                    }
                }
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(function () {
                        toast('Logs copiados.');
                    }, fallbackCopy);
                } else {
                    fallbackCopy();
                }
            });
        }

        // Pintar lo capturado antes de que existiera el panel.
        renderAllLogs();
        if ((window.__ukLogErrorCount || 0) > 0) openLog();
        diag('Consola lista. F2 para abrir/cerrar.', 'info');

        document.addEventListener('keydown', function (e) {
            if (e.key === 'F3') {
                e.preventDefault();
                UKDebug.toggle();
            } else if (e.key === 'F2') {
                e.preventDefault();
                UKLogUI.toggle();
            } else if (e.key === 'Escape' && logOpen) {
                e.preventDefault();
                UKLogUI.toggle();
            } else if (e.key === 'Escape' && dbgOpen) {
                e.preventDefault();
                UKDebug.toggle();
            }
        }, true);
      })();
    </script>
  </body>
</html>
